name: Tests

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - develop
    paths:
      - '**.php'
      - 'composer.json'
      - 'composer.lock'
      - 'phpunit.xml.dist'
  pull_request:
    paths:
      - '**.php'
      - 'composer.json'
      - 'composer.lock'
      - 'phpunit.xml.dist'
  release:
    types: [published]

jobs:
  unit:
    name: Unit Tests (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        php: ['8.1', '8.2', '8.3', '8.4']

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          tools: composer:v2
          coverage: none

      - name: Get Composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT

      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: ${{ runner.os }}-composer-

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress

      - name: Run unit tests
        run: ./vendor/bin/phpunit --configuration phpunit-unit.xml.dist --no-coverage

  integration:
    name: Integration Tests (PHP ${{ matrix.php }}, WP ${{ matrix.wordpress }})
    runs-on: ubuntu-latest
    timeout-minutes: 20

    strategy:
      fail-fast: false
      matrix:
        php: ['8.1', '8.2', '8.3', '8.4']
        # Support policy: the latest two WordPress versions, plus 6.9 for now.
        #
        # `latest` stays dynamic on purpose — it is the policy, not a version.
        # It tracks whatever wordpress.org is serving (7.1 today) so the newest
        # supported release is always covered without editing this file.
        #
        # `7.0` is the pin for the second of the two. That one *does* need a
        # hand each cycle: when 7.2 ships, `latest` follows it automatically and
        # this pin must move 7.0 -> 7.1, or the second-newest release silently
        # stops being tested. It is the only line here that goes stale.
        #
        # `6.9` is the declared floor (`Requires at least: 6.9`) and is extra,
        # beyond the two-version policy — it proves the pre-7.1 fallbacks, since
        # neither 6.9 nor 7.0 has wp_prepare_json_schema_for_client() or
        # WP_Filter_Sentinel. Drop it when 6.9 support ends.
        #
        # `trunk` is early warning for the next one. WordPress 7.1 made the
        # Abilities API validate ability output against the declared
        # output_schema, and this matrix would have met that on release day
        # rather than during beta.
        #
        # WooCommerce coverage is in its own job below.
        wordpress: ['latest', '7.0', '6.9', 'trunk']

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: wordpress_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          tools: composer:v2
          extensions: mysqli, pdo_mysql
          coverage: none

      - name: Get Composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT

      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: ${{ runner.os }}-composer-

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress

      - name: Install Subversion
        run: |
          # Third-party repos pre-installed on the runner (e.g. packages.microsoft.com)
          # intermittently serve a broken signature and fail `apt-get update`.
          # Subversion comes from the Ubuntu repos, so drop those sources first.
          sudo rm -f /etc/apt/sources.list.d/*microsoft* /etc/apt/sources.list.d/*azure* 2>/dev/null || true
          sudo apt-get update
          sudo apt-get install -y subversion

      - name: Install WordPress test suite
        run: |
          chmod +x bin/install-wp-tests.sh
          bin/install-wp-tests.sh wordpress_test root root 127.0.0.1 ${{ matrix.wordpress }} true

      - name: Run integration tests
        run: ./vendor/bin/phpunit --configuration phpunit.xml.dist --no-coverage

  integration-woocommerce:
    name: Integration Tests (WooCommerce ${{ matrix.woocommerce }})
    runs-on: ubuntu-latest
    timeout-minutes: 20

    strategy:
      fail-fast: false
      matrix:
        # Compatibility policy: last 2 stable X.Y versions of WooCommerce.
        # 'latest' tracks the current release (11.1); '11.0' is the previous X.Y.
        # The install script resolves MAJOR.MINOR shorthand to the highest stable patch.
        woocommerce: ['latest', '11.0']

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: wordpress_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          tools: composer:v2
          extensions: mysqli, pdo_mysql
          coverage: none

      - name: Get Composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT

      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: ${{ runner.os }}-composer-

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress

      - name: Install Subversion
        run: |
          # Third-party repos pre-installed on the runner (e.g. packages.microsoft.com)
          # intermittently serve a broken signature and fail `apt-get update`.
          # Subversion comes from the Ubuntu repos, so drop those sources first.
          sudo rm -f /etc/apt/sources.list.d/*microsoft* /etc/apt/sources.list.d/*azure* 2>/dev/null || true
          sudo apt-get update
          sudo apt-get install -y subversion

      - name: Install WordPress test suite + WooCommerce
        env:
          WC_VERSION: ${{ matrix.woocommerce }}
        run: |
          chmod +x bin/install-wp-tests.sh
          bin/install-wp-tests.sh wordpress_test root root 127.0.0.1 latest true

      - name: Run integration tests
        run: ./vendor/bin/phpunit --configuration phpunit.xml.dist --no-coverage
