name: Code Quality

on:
  pull_request:
    branches:
      - main
      - development
    paths:
      - '**.php'
      - 'composer.json'
      - 'composer.lock'
      - 'lib/mcp-adapter/composer.json'
      - 'lib/mcp-adapter/composer.lock'
      - 'phpcs.xml.dist'
      - 'phpstan.neon'

jobs:
  phpcs:
    name: PHPCS
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          tools: composer:v2
          coverage: none

      - name: Get Composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT

      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: ${{ runner.os }}-composer-

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress

      - name: Run PHPCS
        run: ./vendor/bin/phpcs --standard=phpcs.xml.dist src/

  phpstan:
    name: PHPStan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          tools: composer:v2
          coverage: none

      - name: Get Composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT

      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: ${{ runner.os }}-composer-

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress

      # The React admin screens require() assets/build/js/*.asset.php, gitignored
      # build artifacts rebuilt by release.yml. This job is PHP-only, so stub them
      # to let PHPStan resolve the (runtime-guarded) require paths.
      #
      # Derived from the source rather than listed, because the list was hard-coded
      # for one screen and adding a second broke this job on a branch that had
      # passed locally: the build existed there, and PHPStan's result cache kept
      # the failure hidden even after it was deleted.
      - name: Stub build assets for analysis
        run: |
          mkdir -p assets/build/js
          grep -rhoE "assets/build/js/[a-z0-9-]+\.asset\.php" src/ | sort -u | while read -r asset; do
            printf '<?php return array( "dependencies" => array(), "version" => "dev" );\n' > "$asset"
            echo "stubbed $asset"
          done

      - name: Run PHPStan
        run: ./vendor/bin/phpstan analyse --no-progress
