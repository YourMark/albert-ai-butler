name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version number (e.g. 1.0.0-test)'
        required: true
        default: '1.0.0-test'
      dry_run:
        description: 'Dry run (build only, no release)'
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  build:
    name: Build and Release
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          # Full history + tags so the changelog step can diff against the
          # previous tag (the default shallow clone has only the tagged commit).
          fetch-depth: 0
          fetch-tags: true

      - name: Get version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "version=${{ github.event.inputs.version }}" >> $GITHUB_OUTPUT
          else
            echo "version=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT
          fi

      - name: Check if pre-release
        id: prerelease
        run: |
          if [[ "${{ steps.version.outputs.version }}" =~ (alpha|beta|rc|dev|test) ]]; then
            echo "is_prerelease=true" >> $GITHUB_OUTPUT
          else
            echo "is_prerelease=false" >> $GITHUB_OUTPUT
          fi

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          tools: composer:v2
          coverage: none

      - name: Install production dependencies
        # One install, no build step. Composer's post-install hook also installs
        # the bundled MCP adapter in lib/mcp-adapter/, and Jetpack Autoloader
        # writes both manifests from Composer's own hook.
        run: composer install --no-dev --prefer-dist --optimize-autoloader --no-progress

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build admin assets
        # Compiles the React/DataViews admin app into assets/build/ (gitignored).
        # The "Copy plugin files" step ships it via `cp -r assets`.
        run: |
          npm ci
          npm run build

      - name: Create plugin directory
        run: mkdir -p build/albert-ai-butler

      # Built from the working tree minus .distignore, which is the same rule
      # the WordPress.org deploy step below applies. It used to be a hand-kept
      # allowlist of `cp` commands, which failed closed and silently: `skills/`
      # was added in 1.2.0, never appeared in that list, and so was absent from
      # every zip from 1.2.0 to 1.4.0-beta1 while being present in the repo and
      # on every developer's checkout. Nothing failed; the feature was simply
      # not there. One list now governs both paths, and a new directory ships
      # unless it is deliberately excluded.
      - name: Copy plugin files
        run: |
          # Both excludes are anchored with a leading slash. An unanchored
          # `build/` matches at any depth and would take `assets/build/` with
          # it, shipping a plugin whose admin screens have no JavaScript.
          rsync -a \
            --exclude='/.git/' \
            --exclude='/build/' \
            --exclude-from='.distignore' \
            ./ build/albert-ai-butler/

      - name: Verify the package carries what it claims
        run: |
          # A missing runtime file is invisible at build time and only shows up
          # as an empty screen on somebody's site, which is exactly how the
          # skills omission survived three releases.
          missing=0
          for required in \
            albert-ai-butler.php \
            readme.txt \
            changelog.txt \
            composer.json \
            LICENSE \
            src \
            vendor \
            lib/mcp-adapter/vendor/composer/jetpack_autoload_classmap.php \
            assets/build/js \
            skills/block-editor.md
          do
            if [ ! -e "build/albert-ai-butler/$required" ]; then
              echo "::error::missing from the package: $required"
              missing=1
            fi
          done

          for forbidden in tests .github node_modules assets/src docs
          do
            if [ -e "build/albert-ai-butler/$forbidden" ]; then
              echo "::error::should not be packaged: $forbidden"
              missing=1
            fi
          done

          exit $missing

      - name: Strip non-permitted vendor files
        run: |
          # The bundled adapter in lib/mcp-adapter/vendor/ deliberately ships. It
          # is Albert's fallback when the MCP Adapter plugin is not active.
          find build/albert-ai-butler/vendor build/albert-ai-butler/lib -name "*.sh" -type f -delete

          # The adapter also ships as a standalone plugin; nothing here loads
          # its bootstrap or its readme, and .distignore excludes both so the
          # copy above never brings them across.
          #
          # Both halves are asserted rather than assumed. Checking only the
          # package would pass just as well if upstream renamed the files and
          # .distignore silently stopped matching anything, which is the same
          # class of quiet failure that kept skills/ out of every release.
          for f in mcp-adapter.php readme.txt; do
            test -f "lib/mcp-adapter/vendor/wordpress/mcp-adapter/$f" \
              || { echo "::error::lib/mcp-adapter/vendor/wordpress/mcp-adapter/$f is gone; upstream layout changed and .distignore now matches nothing"; exit 1; }

            test ! -e "build/albert-ai-butler/lib/mcp-adapter/vendor/wordpress/mcp-adapter/$f" \
              || { echo "::error::$f reached the package; .distignore no longer excludes it"; exit 1; }
          done

      - name: Create zip file
        working-directory: build
        run: zip -r albert-ai-butler-${{ steps.version.outputs.version }}.zip albert-ai-butler

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: albert-ai-butler-${{ steps.version.outputs.version }}
          path: build/albert-ai-butler

      - name: Generate changelog
        if: github.event.inputs.dry_run != 'true'
        id: changelog
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          # Pre-release suffixes (e.g. 1.2.0-beta2) map to the base version's
          # readme section (= 1.2.0 =).
          BASE_VERSION="${VERSION%%-*}"

          # Prefer the curated readme.txt changelog section for this version:
          # everything between "= BASE_VERSION =" and the next "= x =" / "== ... ==".
          NOTES=$(awk -v ver="= ${BASE_VERSION} =" '
            $0 == ver { flag = 1; next }
            flag && ( /^= [0-9]/ || /^== / ) { exit }
            flag { print }
          ' readme.txt)

          # Fall back to the commit log since the previous tag if no section matched.
          if [ -z "$(echo "$NOTES" | tr -d '[:space:]')" ]; then
            PREVIOUS_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")
            if [ -n "$PREVIOUS_TAG" ]; then
              NOTES=$(git log --pretty=format:"- %s" "$PREVIOUS_TAG"..HEAD --no-merges)
            else
              NOTES=$(git log --pretty=format:"- %s" --no-merges -20)
            fi
          fi

          # readme.txt is WordPress.org's format, where HTML entities render.
          # GitHub release notes are Markdown, where they do not, so "Albert
          # &rarr; Context" reaches a reader verbatim. Translate the ones the
          # changelog actually uses rather than every entity in existence.
          NOTES=$(printf '%s\n' "$NOTES" | sed \
            -e 's/&rarr;/→/g' \
            -e 's/&larr;/←/g' \
            -e 's/&mdash;/—/g' \
            -e 's/&ndash;/–/g' \
            -e 's/&hellip;/…/g' \
            -e 's/&amp;/\&/g')

          # For pre-releases, note the build identifier above the section notes.
          if [ "${{ steps.prerelease.outputs.is_prerelease }}" = "true" ]; then
            printf 'Pre-release build (%s) of %s for testing.\n\n%s\n' "$VERSION" "$BASE_VERSION" "$NOTES" > changelog.txt
          else
            printf '%s\n' "$NOTES" > changelog.txt
          fi

          echo "changelog_file=changelog.txt" >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        if: github.event.inputs.dry_run != 'true'
        uses: softprops/action-gh-release@v2
        with:
          name: "Release ${{ steps.version.outputs.version }}"
          tag_name: ${{ github.event_name == 'workflow_dispatch' && format('v{0}', steps.version.outputs.version) || github.ref }}
          body_path: changelog.txt
          prerelease: ${{ steps.prerelease.outputs.is_prerelease == 'true' }}
          files: build/albert-ai-butler-${{ steps.version.outputs.version }}.zip
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  deploy:
    name: Deploy to WordPress.org
    runs-on: ubuntu-latest
    needs: build
    if: >-
      github.event.inputs.dry_run != 'true' &&
      ! contains(needs.build.outputs.version, 'alpha') &&
      ! contains(needs.build.outputs.version, 'beta') &&
      ! contains(needs.build.outputs.version, 'rc') &&
      ! contains(needs.build.outputs.version, 'dev') &&
      ! contains(needs.build.outputs.version, 'test')

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          tools: composer:v2
          coverage: none

      - name: Install production dependencies
        run: composer install --no-dev --prefer-dist --optimize-autoloader --no-progress

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build admin assets
        # assets/build/ is gitignored, so it must be compiled before the SVN
        # deploy reads the working tree (.distignore keeps assets/src/ out).
        run: |
          npm ci
          npm run build

      - name: Verify the bundled MCP adapter is installed
        # Installed by Composer's post-install hook. Without it the deploy would
        # ship a plugin with no adapter for sites lacking the MCP Adapter plugin.
        run: |
          test -f lib/mcp-adapter/vendor/composer/jetpack_autoload_classmap.php \
            || { echo "::error::lib/mcp-adapter/vendor is missing; the bundled MCP adapter was not installed"; exit 1; }

      - name: Deploy to WordPress.org
        uses: 10up/action-wordpress-plugin-deploy@stable
        with:
          generate-zip: false
        env:
          SVN_USERNAME: ${{ secrets.SVN_USERNAME }}
          SVN_PASSWORD: ${{ secrets.SVN_PASSWORD }}
          SLUG: albert-ai-butler
